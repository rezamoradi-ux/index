
<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SHIK COT LED DISPLAY</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

.screen {
  width: 100vw;
  height: 100vh;
  background: #000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  color: #ff1717;
  font-family: Tahoma, Arial, sans-serif;
}

/* متن اصلی */
.main {
  height: 66%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.main span {
  position: absolute;
  white-space: nowrap;
  font-weight: 900;
  color: #ff1717;
  text-shadow:
    0 0 3px #ff0000,
    0 0 8px #a90000;
}

.persian {
  font-size: clamp(38px, 13vw, 100px);
  animation: persianFade 8s ease-in-out infinite;
}

.english {
  font-family: Arial, sans-serif;
  font-size: clamp(34px, 12vw, 92px);
  letter-spacing: 2px;
  animation: englishFade 8s ease-in-out infinite;
}

@keyframes persianFade {
  0%, 8% { opacity: 0; transform: scale(.94); }
  22%, 42% { opacity: 1; transform: scale(1); }
  54%, 100% { opacity: 0; transform: scale(1.03); }
}

@keyframes englishFade {
  0%, 48% { opacity: 0; transform: scale(.94); }
  62%, 82% { opacity: 1; transform: scale(1); }
  94%, 100% { opacity: 0; transform: scale(1.03); }
}

/* نوار متنی بی‌نهایت */
.ticker {
  height: 34%;
  width: 100%;
  display: flex;
  align-items: center;
  overflow: hidden;
  white-space: nowrap;
  border-top: 1px solid #790000;
  box-shadow: 0 -2px 8px rgba(255,0,0,.18);
}

.ticker-track {
  display: flex;
  width: max-content;
  flex-shrink: 0;
  animation: tickerMove 90s linear infinite;
  will-change: transform;
}

.ticker-text {
  direction: rtl;
  unicode-bidi: plaintext;
  display: block;
  flex-shrink: 0;
  white-space: nowrap;
  padding-left: 100px;
  font-size: clamp(15px, 4.2vw, 30px);
  font-weight: 900;
  color: #ff1717;
  text-shadow:
    0 0 3px #ff0000,
    0 0 7px #990000;
}

/* حرکت از چپ به راست */
@keyframes tickerMove {
  from { transform: translateX(-50%); }
  to { transform: translateX(0); }
}
</style>
</head>

<body>
<div class="screen">

  <div class="main">
    <span class="persian">آرایشگاه</span>
    <span class="english">SHIK COT</span>
  </div>

  <div class="ticker">
    <div class="ticker-track">

      <div class="ticker-text">
        اصلاح مدل مو ✦ حالت مو ✦ ماساژ ✦ خدمات داماد ✦ سشوار ✦ خدمات پوست ✦ شماره تماس 09213493752 ✦ اینستاگرام shik_cot ✦
      </div>

      <div class="ticker-text" aria-hidden="true">
        اصلاح مدل مو ✦ حالت مو ✦ ماساژ ✦ خدمات داماد ✦ سشوار ✦ خدمات پوست ✦ شماره تماس 09213493752 ✦ اینستاگرام shik_cot ✦
      </div>

    </div>
  </div>

</div>
</body>
</html>
